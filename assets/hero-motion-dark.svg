<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100"><style>.flow{animation:flow 14s linear infinite}.breathe{animation:breathe 8s ease-in-out infinite}.drift{animation:drift 16s ease-in-out infinite}.orbit{transform-origin:1060px 50px;animation:spin 50s linear infinite}@keyframes flow{to{stroke-dashoffset:-160}}@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.65}}@keyframes drift{50%{transform:translate(15px,-5px)}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><style>.phrase{opacity:0;animation:words 25s linear infinite}.p0{opacity:1}.p1{animation-delay:5s}.p2{animation-delay:10s}.p3{animation-delay:15s}.p4{animation-delay:20s}@keyframes words{0%,1%{opacity:0}4%,17%{opacity:1}20%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){.phrase{animation:none;opacity:0}.p0{opacity:1}}</style><defs><linearGradient id="aurora"><stop stop-color="#0b1c32"/><stop offset="1" stop-color="#241f40"/></linearGradient></defs><rect width="1200" height="100" rx="15" fill="url(#aurora)"/><path class="drift breathe" d="M0 90Q400-50 850 65T1250 20" fill="none" stroke="#9de7f3" stroke-width="14" opacity=".2"/><g font-family="Arial,sans-serif" font-size="31" fill="#f0f6ff"><text class="phrase p0" x="50" y="60">Python Backend Developer</text><text class="phrase p1" x="50" y="60">Building with FastAPI</text><text class="phrase p2" x="50" y="60">Engineering Practical AI Systems</text><text class="phrase p3" x="50" y="60">Exploring Cloud Architecture</text><text class="phrase p4" x="50" y="60">Software Engineer in the Making</text></g><g class="orbit" fill="none" stroke="#9de7f3" opacity=".4"><ellipse cx="1060" cy="50" rx="90" ry="25"/><ellipse cx="1060" cy="50" rx="70" ry="40"/><circle cx="1150" cy="50" r="4" fill="#9de7f3"/></g><g class="drift" fill="#9de7f3" opacity=".5"><circle cx="860" cy="20" r="2"/><circle cx="930" cy="70" r="3"/><circle cx="1180" cy="18" r="2"/></g></svg>