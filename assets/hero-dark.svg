.orbit{transform-origin:982px 185px;animation:orbit 42s linear infinite}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.phase{opacity:0;animation:words 20s linear infinite}
.ph0{animation-delay:0s}.ph1{animation-delay:5s}.ph2{animation-delay:10s}.ph3{animation-delay:15s}
.dash{animation:flow 12s linear infinite}
@keyframes twinkle{0%,100%{opacity:.17}50%{opacity:.55}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.75}}
@keyframes words{0%,1%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-120}}
@media (prefers-reduced-motion:reduce){.star,.orbit,.float,.pulse,.dash,.phase{animation:none}.ph0{opacity:1}.ph1,.ph2,.ph3{opacity:0}}
</style>
