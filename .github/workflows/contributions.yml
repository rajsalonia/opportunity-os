name: Contribution animation
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/contributions.yml"]
  schedule:
    - cron: "23 3 * * *"
permissions:
  contents: read
concurrency:
  group: profile-animation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rajsalonia
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
      - name: Validate generated assets
        run: |
          test -s dist/snake.svg
          test -s dist/snake-dark.svg
          grep -q '<svg' dist/snake.svg
          grep -q '<svg' dist/snake-dark.svg
      - name: Publish assets and enable image only after success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r dist "$RUNNER_TEMP/profile-snake"
          git fetch origin output || true
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf .
          fi
          cp "$RUNNER_TEMP/profile-snake/"*.svg .
          git add snake.svg snake-dark.svg
          git diff --cached --quiet || git commit -m "assets: refresh contribution animation"
          git push origin output
          git checkout main
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          start, end = "<!-- SNAKE:START -->", "<!-- SNAKE:END -->"
          image = '<picture>\n<source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/rajsalonia/rajsalonia/output/snake-dark.svg">\n<img src="https://raw.githubusercontent.com/rajsalonia/rajsalonia/output/snake.svg" alt="Animated contribution graph — native activity link above provides a fallback" width="960">\n</picture>'
          p.write_text(s[:s.index(start)+len(start)] + "\n" + image + "\n" + s[s.index(end):])
          PY
          git add README.md
          git diff --cached --quiet || git commit -m "design: enable verified contribution animation"
          git push origin main
