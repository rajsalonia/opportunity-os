name: Opportunity OS checks
on:
  push:
    branches: [opportunity-os-hosted]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check static/app.js
      - run: node --check static/workspace.js
      - run: node --check autofill_companion/popup.js
      - run: python -m pytest -q tests
